<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c2a3b">
<title>Averse de Calculs</title>
</head>
<body>
<style>
@font-face{font-family:'Baloo 2';font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:500;font-display:swap;src:url(fonts/nunito-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one-screen game — HUD band, falling field, rising lake, keypad dock */
:root{
  --sky-top:#123a52; --sky-bot:#1f6a7c; --lake:#2bb3c0; --lake-deep:#167c8f;
  --drop:#e8fbff; --drop-ink:#0f3446; --sun:#ffc94a; --coral:#ff7a6b;
  --panel:#0c2a3b; --panel-2:#143c52; --ink:#eaf7fa; --muted:#9cc4cf;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel)}
.hud .stat{display:flex;flex-direction:column;line-height:1.05}
.hud .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hud .val{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.progress{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;align-self:center;min-width:60px}
.progress i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .25s}
.lives{display:flex;gap:3px;font-size:18px}
.lives span{width:12px;height:16px;background:var(--lake);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:polygon(50% 0,100% 62%,92% 88%,50% 100%,8% 88%,0 62%)}
.lives span.off{background:var(--panel-2)}

.field{position:relative;flex:1;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot))}
.drop{position:absolute;left:0;top:0;width:56px;height:66px;display:grid;place-items:center;padding-top:12px;
  font-family:var(--display);font-weight:800;font-size:13px;color:var(--drop-ink);will-change:transform}
.drop::before{content:"";position:absolute;inset:0;background:var(--drop);clip-path:path("M28 0 C35 15.2 53.7 30.3 53.7 44.3 A25.7 21 0 0 1 2.3 44.3 C2.3 30.3 21 15.2 28 0Z");opacity:.95}
.drop.gold::before{background:var(--sun)}
.drop b{position:relative;white-space:nowrap;font-variant-numeric:tabular-nums}
.drop.pop{animation:pop .3s ease-out forwards}
.drop.splash{animation:splash .35s ease-in forwards}
@keyframes pop{to{opacity:0;scale:1.5}}
@keyframes splash{to{opacity:0;scale:1.4 .2}}
.lake{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(var(--lake),var(--lake-deep));transition:height .4s ease}
.lake::before{content:"";position:absolute;left:0;right:0;top:-8px;height:16px;background:radial-gradient(14px 8px at 14px 8px,var(--lake) 98%,transparent) 0 0/28px 16px repeat-x;animation:wave 3s linear infinite}
@keyframes wave{to{background-position:28px 0}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--panel) 72%,transparent);text-align:center}
.card{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:320px}
.card h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.45}
.card .big{font-family:var(--display);font-size:22px;color:var(--ink)}
.btn{font:800 18px var(--body);border:0;border-radius:14px;padding:12px 28px;background:var(--sun);color:var(--drop-ink);cursor:pointer}
.seg{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:14px}
.seg button{font:800 15px var(--body);border:0;border-radius:10px;padding:8px 14px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lake);color:var(--drop-ink)}
.link{background:none;border:0;color:var(--muted);font:700 14px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.seg button:focus-visible,.link:focus-visible,.btn:focus-visible,.key:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.dock{background:var(--panel);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.answer{height:46px;border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink)}
.answer.empty{color:var(--muted);font-size:15px;font-family:var(--body);font-weight:700}
.answer.bad{animation:shake .3s;background:color-mix(in srgb,var(--coral) 40%,var(--panel-2))}
@keyframes shake{25%{translate:-6px}75%{translate:6px}}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{height:50px;border:0;border-radius:12px;background:var(--panel-2);color:var(--ink);font:800 22px var(--display);cursor:pointer}
.key:active{background:var(--lake-deep)}
.key.ok{grid-row:span 2;height:auto;background:var(--lake);color:var(--drop-ink)}
.key.alt{font-size:16px;color:var(--muted)}
.toast{position:absolute;left:50%;top:18px;translate:-50% 0;font-family:var(--display);font-weight:800;font-size:22px;color:var(--sun);pointer-events:none;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
@media (max-height:640px){.key{height:42px}.answer{height:40px}}
@media (prefers-reduced-motion:reduce){.lake::before{animation:none}.drop.pop,.drop.splash{animation-duration:.01s}}
</style>

<div class="app">
  <div class="hud">
    <div class="stat"><span class="lbl">Niveau</span><span class="val" id="stage">1</span></div>
    <div class="progress" aria-label="Progression du niveau"><i id="prog"></i></div>
    <div class="stat" style="text-align:right"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
    <div class="lives" id="lives" aria-label="Vies"></div>
  </div>

  <div class="field" id="field">
    <div class="lake" id="lake"></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay">
      <div class="card" id="card">
        <h1>Averse de Calculs</h1>
        <p>Résous chaque goutte avant qu'elle touche le lac. Tape la réponse : la goutte éclate toute seule. Une goutte dorée efface tout l'écran.</p>
        <div class="seg" role="group" aria-label="Difficulté">
          <button data-diff="facile">Facile</button><button data-diff="normal">Normal</button><button data-diff="expert">Expert</button>
        </div>
        <p id="best"></p>
        <button class="btn" id="start">Jouer</button>
        <button class="link" id="snd">Son activé</button>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="answer empty" id="answer">Tape ta réponse</div>
    <div class="keys" id="keys">
      <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key alt" data-k="del" aria-label="Effacer">⌫</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key ok" data-k="ok">OK</button>
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key alt" data-k="clr">C</button><button class="key">0</button><button class="key alt" data-k="neg">−</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const field = $('field'), lake = $('lake'), overlay = $('overlay'), card = $('card'), answerEl = $('answer');
const MAX_LIVES = 3;
let state = null, typed = '', last = 0, raf = 0;

// Settings: difficulty and sound, remembered on this device
const DIFFS = {
  facile:{ speed:.7,  every:1.3, goal:-2 },
  normal:{ speed:1,   every:1,   goal:0 },
  expert:{ speed:1.35,every:.75, goal:2 },
};
function getPref(k,d){ try{ return localStorage.getItem(k) ?? d }catch(e){ return d } }
function setPref(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
let diff = getPref('averse-diff','normal'); if(!DIFFS[diff]) diff='normal';
let soundOn = getPref('averse-sound','1')==='1';

function bestScore(){ return +getPref('averse-best-'+diff, 0) || 0 }
function saveBest(v){ setPref('averse-best-'+diff, v) }
function showBest(){ const b = bestScore(); $('best').textContent = b ? `Meilleur score (${diff}) : ${b}` : ''; }

function bindMenu(){
  card.querySelectorAll('[data-diff]').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.diff===diff);
    b.onclick = ()=>{ diff=b.dataset.diff; setPref('averse-diff',diff); bindMenu(); };
  });
  $('snd').textContent = soundOn ? 'Son activé' : 'Son coupé';
  $('snd').onclick = ()=>{ soundOn=!soundOn; setPref('averse-sound', soundOn?'1':'0'); bindMenu(); if(soundOn) popSnd(1); };
  $('start').onclick = start;
  showBest();
}
function showMenu(){ card.innerHTML = menuHTML; bindMenu(); }

// Sounds, synthesized with Web Audio (no files needed)
let actx = null;
function audio(){
  if(!soundOn) return null;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
  catch(e){ return null }
  return actx;
}
function tone(freq,dur,type='sine',vol=.2,slideTo){
  const a = audio(); if(!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
const popSnd = c => { const s=Math.min(c,8); tone(480+s*60,.12,'sine',.25,900+s*90); };
const wrongSnd = () => tone(190,.2,'square',.07,110);
const goldSnd = () => [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.16),i*70));
const clearSnd = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.18),i*110));
const overSnd = () => tone(320,.7,'sawtooth',.06,80);
function splashSnd(){
  const a = audio(); if(!a) return;
  const len = a.sampleRate*.35, b = a.createBuffer(1,len,a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len)**2;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type='lowpass'; f.frequency.value=800; g.gain.value=.45;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function buzz(p){ if(!soundOn) return; try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }

const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));

// Difficulty per stage: operations unlocked, number ranges, speed and rain rate
function stageCfg(n){
  const D = DIFFS[diff];
  const ops = n===1 ? ['+'] : n===2 ? ['+','-'] : n===3 ? ['+','-','×'] : ['+','-','×','÷'];
  return {
    ops, max: Math.min(9 + n*3, 40), tableMax: Math.min(4 + n, 12),
    goal: 8 + n*2 + D.goal,
    speed: (26 + n*6) * D.speed,                // pixels / second
    every: Math.max(3.6 - n*0.3, 1.3) * D.every, // seconds between drops
  };
}

function makeProblem(cfg){
  const op = cfg.ops[rnd(0,cfg.ops.length-1)];
  let a,b,r;
  if(op==='+'){ a=rnd(1,cfg.max); b=rnd(1,cfg.max); r=a+b; }
  else if(op==='-'){ a=rnd(2,cfg.max); b=rnd(1,a); r=a-b; }
  else if(op==='×'){ a=rnd(2,cfg.tableMax); b=rnd(2,cfg.tableMax); r=a*b; }
  else { b=rnd(2,cfg.tableMax); r=rnd(1,cfg.tableMax); a=b*r; }
  return { text:`${a} ${op} ${b}`, result:r };
}

function start(){
  audio();
  cancelAnimationFrame(raf);
  field.querySelectorAll('.drop').forEach(d=>d.remove());
  state = { stage:1, score:0, lives:MAX_LIVES, solved:0, drops:[], timer:1, combo:0, running:true };
  startStage();
}
function startStage(){
  state.cfg = stageCfg(state.stage);
  state.solved = 0; state.spawned = 0; state.timer = 0.6;
  overlay.hidden = true; typed=''; renderAnswer(); renderHud();
  toast(`Niveau ${state.stage}`);
  last = performance.now(); raf = requestAnimationFrame(loop);
}

function spawn(){
  const p = makeProblem(state.cfg);
  const el = document.createElement('div');
  const gold = state.stage>1 && Math.random()<0.07;
  el.className = 'drop' + (gold?' gold':'');
  el.innerHTML = `<b>${p.text}</b>`;
  const w = field.clientWidth;
  // avoid stacking on a recent drop
  let x, tries=0;
  do { x = rnd(4, Math.max(4, w-60)); tries++; }
  while(tries<8 && state.drops.some(d=>d.y<72 && Math.abs(d.x-x)<56));
  const d = { el, x, y:-66, ...p, gold };
  el.style.transform = `translate(${x}px,${d.y}px)`;
  field.insertBefore(el, lake);
  state.drops.push(d); state.spawned++;
}

function loop(t){
  if(!state.running) return;
  const dt = Math.min((t-last)/1000, 0.05); last = t;
  const remaining = state.cfg.goal - state.solved - state.drops.length;
  state.timer -= dt;
  if(state.timer<=0 && remaining>0){ spawn(); state.timer = state.cfg.every * (0.8+Math.random()*0.4); }
  if(state.drops.length===0 && remaining>0 && state.timer>0.4) state.timer = 0.4;

  const floor = field.clientHeight - lake.offsetHeight - 42;
  for(const d of [...state.drops]){
    d.y += state.cfg.speed*dt;
    d.el.style.transform = `translate(${d.x}px,${d.y}px)`;
    if(d.y > floor) miss(d);
  }
  if(state.running) raf = requestAnimationFrame(loop);
}

function remove(d, cls){
  state.drops = state.drops.filter(x=>x!==d);
  d.el.classList.add(cls);
  setTimeout(()=>d.el.remove(), 350);
}

function miss(d){
  remove(d,'splash'); splashSnd(); buzz(90);
  state.lives--; state.combo=0;
  renderHud();
  if(state.lives<=0) gameOver();
}

// the lowest matching drop is the most urgent one
function findHit(){ const v = +typed; return state.drops.filter(d=>d.result===v).sort((a,b)=>b.y-a.y)[0]; }

// Auto-validation: pops as soon as the typed number matches a drop;
// flags an error once no falling answer can start with what was typed
function check(){
  if(!state || !state.running || typed==='' || typed==='-' || !state.drops.length) return;
  const d = findHit();
  if(d) hit(d);
  else if(!state.drops.some(x=>String(x.result).startsWith(typed))) wrong();
}
function submit(){
  if(!state || !state.running || typed==='' || typed==='-') return;
  const d = findHit();
  d ? hit(d) : wrong();
}
function wrong(){
  state.combo=0; wrongSnd(); buzz([40,40,40]);
  answerEl.classList.remove('bad'); void answerEl.offsetWidth; answerEl.classList.add('bad');
  typed=''; setTimeout(renderAnswer,300);
}
function hit(d){
  {
    state.combo++;
    const pts = 10*state.stage + Math.min(state.combo-1,5)*5;
    if(d.gold){
      const all = [...state.drops];
      all.forEach(x=>remove(x,'pop'));
      state.solved += all.length; state.score += pts*all.length;
      toast('Éclaircie !'); goldSnd(); buzz(60);
    } else {
      remove(d,'pop'); state.solved++; state.score += pts; popSnd(state.combo);
      if(state.combo>=3) toast(`Série ×${state.combo}`);
    }
    typed=''; renderAnswer(); renderHud();
    if(state.solved >= state.cfg.goal) stageClear();
  }
}

function stageClear(){
  state.running=false; clearSnd();
  const bonus = state.lives*25;
  state.score += bonus; renderHud();
  card.innerHTML = `<h2>Niveau ${state.stage} réussi</h2>
    <p>Bonus lac : ${state.lives} × 25 = <b>+${bonus}</b></p>
    <p class="big">Score ${state.score}</p>
    <button class="btn" id="next">Niveau ${state.stage+1}</button>`;
  overlay.hidden=false;
  $('next').onclick = ()=>{ state.stage++; state.running=true; startStage(); };
  $('next').focus();
}

function gameOver(){
  state.running=false; overSnd(); buzz(300);
  const best = Math.max(bestScore(), state.score); saveBest(best);
  setTimeout(()=>{
    state.drops.forEach(d=>d.el.remove()); state.drops=[];
    card.innerHTML = `<h2>Le lac a débordé</h2>
      <p class="big">Score ${state.score}</p>
      <p>Niveau atteint : ${state.stage} · Meilleur : ${best}</p>
      <button class="btn" id="again">Rejouer</button>
      <button class="link" id="menu">Changer de difficulté</button>`;
    overlay.hidden=false; $('again').onclick = start; $('menu').onclick = showMenu; $('again').focus();
  },400);
}

function renderHud(){
  $('stage').textContent = state.stage;
  $('score').textContent = state.score;
  $('prog').style.width = Math.min(100, state.solved/state.cfg.goal*100)+'%';
  $('lives').innerHTML = Array.from({length:MAX_LIVES},(_,i)=>`<span class="${i<state.lives?'':'off'}"></span>`).join('');
  lake.style.height = (34 + (MAX_LIVES-state.lives)*40) + 'px';
}
function renderAnswer(){
  answerEl.classList.remove('bad');
  answerEl.classList.toggle('empty', typed==='');
  answerEl.textContent = typed==='' ? 'Tape ta réponse' : typed.replace('-','−');
}
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),900); }

function press(k){
  if(k==='ok') return submit();
  if(k==='del') typed = typed.slice(0,-1);
  else if(k==='clr') typed='';
  else if(k==='neg') typed = typed.startsWith('-') ? typed.slice(1) : '-'+typed;
  else if(typed.replace('-','').length<4) typed += k;
  renderAnswer();
  if(/^[0-9]$/.test(k)) check();
}
$('keys').addEventListener('pointerdown', e=>{
  const b = e.target.closest('.key'); if(!b) return;
  e.preventDefault(); press(b.dataset.k || b.textContent);
});
document.addEventListener('keydown', e=>{
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('del');
  else if(e.key==='-') press('neg');
  else if(e.key==='Enter'){ if(e.target.tagName==='BUTTON') return; if(!overlay.hidden){ const b=card.querySelector('.btn'); b&&b.click(); } else press('ok'); }
});
const menuHTML = card.innerHTML;
bindMenu();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && state && state.running){ last=performance.now(); } });
</script>

</body>
</html>
